{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Not Found - Shadow Resume</title>
  <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="text-center px-6 py-12 bg-white rounded-2xl shadow-md max-w-md border border-gray-200">
    <img src="{% static 'images/404.svg' %}" alt="404 Not Found" class="mx-auto w-40 mb-6">
    <h1 class="text-4xl font-extrabold text-red-500 mb-2">404</h1>
    <p class="text-lg font-medium text-gray-700 mb-4">Oops! The page you're looking for doesn't exist.</p>
    <a href="/" class="inline-block px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow hover:bg-blue-700 transition">
      ⬅️ Back to Dashboard
    </a>
  </div>
</body>
</html>
