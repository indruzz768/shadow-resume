<header class="bg-white shadow-md p-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
        <img src="{% static 'images/shadow.png' %}" alt="Shadow Resume Logo" class="h-8 w-8 object-contain" onerror="this.style.display='none'">
        <h1 class="text-xl font-bold text-gray-800">Shadow Resume</h1>
    </div>

    <div class="flex items-center gap-4">
        {% if request.user.is_authenticated %}
            <span class="text-sm text-gray-600">Hello, {{ request.user.username }}</span>
            {% if request.user.profile_photo %}
                <img src="{{ request.user.profile_photo.url }}" alt="Profile Photo"
                     class="h-8 w-8 rounded-full object-cover border border-gray-300 shadow-sm">
            {% endif %}
            <a href="{% url 'account_logout' %}" class="text-sm text-blue-600 hover:underline">Logout</a>
        {% else %}
            <a href="{% url 'account_login' %}" class="text-sm text-blue-600 hover:underline">Login</a>
        {% endif %}
    </div>
</header>
