{% load static %}
<header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
  <!-- Logo + Brand Name -->
  <a href="/" class="flex items-center space-x-3 group">
    <img src="{% static 'images/shadow.png' %}"
         alt="Shadow Resume Logo"
         class="h-10 w-10 rounded-full object-cover ring-2 ring-indigo-500 group-hover:ring-indigo-600 transition-all duration-300 shadow-md"
         onerror="this.style.display='none'">
    <span class="text-xl font-bold text-gray-800 group-hover:text-indigo-700 transition">
      Shadow Resume
    </span>
  </a>

  <!-- User Info / Auth Links -->
  <div class="flex items-center space-x-4">
    {% if request.user.is_authenticated %}
      <span class="text-sm text-gray-700 hidden sm:inline-block">Hi, {{ request.user.username }}</span>

      {% if request.user.profile_photo %}
        <img src="{{ request.user.profile_photo.url }}" alt="Profile"
             class="h-9 w-9 rounded-full object-cover border border-gray-300 shadow-sm ring-1 ring-indigo-300">
      {% else %}
        <div class="h-9 w-9 flex items-center justify-center rounded-full bg-gray-200 text-xs text-gray-500 border">
          N/A
        </div>
      {% endif %}

      <a href="{% url 'account_logout' %}"
         class="text-sm text-red-600 hover:underline">Logout</a>
    {% else %}
      <a href="{% url 'account_login' %}"
         class="text-sm text-indigo-600 hover:underline">Login</a>
    {% endif %}
  </div>
</header>
