{% load static %}
<header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-6 py-4 shadow-md flex justify-between items-center transition-all duration-300">
  <!-- 🔹 Left: Brand & Mobile Toggle -->
  <div class="flex items-center gap-4">
    
    <!-- ✅ Mobile Only: Menu Toggle -->
    <button id="mobile-menu-button"
            class="text-white p-2 focus:outline-none md:hidden hover:bg-indigo-700 rounded-md"
            aria-label="Toggle Sidebar">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <!-- ✅ Always Visible: Logo & Brand -->
    <a href="{% url 'dashboard' %}" class="flex items-center gap-3 group">
      <img src="{% static 'images/shadow.png' %}" alt="Shadow Resume Logo"
           class="h-10 w-10 rounded-full object-cover ring-2 ring-white group-hover:ring-yellow-300 transition-all duration-300 shadow"
           onerror="this.style.display='none'">
      <h1 class="text-xl sm:text-2xl font-bold group-hover:text-yellow-300 transition-all duration-300">
        Shadow Resume
      </h1>
    </a>
  </div>

  <!-- 🔸 Right: Profile Dropdown or Login -->
  <div x-data="{ open: false }" class="relative">
    {% if request.user.is_authenticated %}
    <button @click="open = !open" class="flex items-center gap-2 focus:outline-none hover:bg-white hover:bg-opacity-10 px-2 py-1 rounded transition">
      {% if request.user.profile_photo %}
        <img src="{{ request.user.profile_photo.url }}" alt="Profile"
             class="h-9 w-9 rounded-full ring ring-white object-cover">
      {% else %}
        <div class="h-9 w-9 flex items-center justify-center rounded-full bg-white bg-opacity-20 text-xs text-white border">
          No Photo
        </div>
      {% endif %}
      <span class="text-sm hidden sm:inline">{{ request.user.username }}</span>
      <i class="fas fa-chevron-down text-xs"></i>
    </button>

    <!-- Dropdown -->
    <div x-show="open"
         @click.away="open = false"
         x-transition
         class="absolute right-0 mt-2 w-48 bg-white text-gray-800 rounded shadow-lg z-50 py-1 border border-gray-200">
      <a href="{% url 'profile' %}" class="block px-4 py-2 text-sm hover:bg-gray-100">👤 Profile</a>
      {% if request.user.role == 'admin' or request.user.is_superuser %}
        <a href="{% url 'admin_dashboard' %}" class="block px-4 py-2 text-sm hover:bg-gray-100">⚙️ Admin Dashboard</a>
      {% endif %}
      <a href="{% url 'account_logout' %}" class="block px-4 py-2 text-sm text-red-600 hover:bg-gray-100">🚪 Logout</a>
    </div>
    {% else %}
      <a href="{% url 'account_login' %}" class="text-sm text-white hover:underline">Login</a>
    {% endif %}
  </div>
</header>
