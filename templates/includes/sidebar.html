{% load static %}
<aside id="sidebar"  class="fixed top-0 left-0 w-64 h-full bg-white shadow-lg z-40 transform transition-transform duration-300 -translate-x-full md:relative md:translate-x-0 md:block">
  <div class="p-6">
    <ul class="space-y-4 text-center">
      <li><a href="{% url 'dashboard' %}" class="text-indigo-600 hover:underline">Dashboard</a></li>
      <li><a href="{% url 'resume_list' %}" class="hover:underline">Resumes</a></li>
      {% if request.user.is_staff and not request.user.is_admin %}
      <li><a href="{% url 'staff_moderation' %}" class="text-red-500 hover:underline">Moderation</a></li>
      {% endif %}
      <li><a href="{% url 'profile' %}" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">👤 Profile</a></li>
      {% if request.user.is_superuser %}
      <li>
        <a href="{% url 'admin_dashboard' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-200">
          🔧 Admin Dashboard
        </a>
      </li>
      {% endif %}
      <li><a href="{% url 'logout' %}" class="text-gray-500 hover:underline">Logout</a></li>
    </ul>
  </div>
</aside>
