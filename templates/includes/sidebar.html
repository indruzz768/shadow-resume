{% load static %}
<aside
  id="sidebar"
  class="fixed top-0 left-0 w-64 h-full bg-gradient-to-b from-indigo-700 via-indigo-800 to-indigo-900 text-white shadow-2xl z-40 transform transition-transform duration-300 -translate-x-full md:relative md:translate-x-0 md:flex md:flex-col"
>
  <div class="h-6 md:h-4"></div>

  <nav class="flex-1 px-4 py-6 space-y-3 text-sm">
    
    <a href="{% url 'dashboard' %}"
       class="flex items-center gap-3 px-3 py-2 rounded-md transition duration-200
       {% if request.resolver_match.url_name == 'dashboard' %}
         bg-white bg-opacity-20 font-semibold
       {% else %}
         hover:bg-white hover:bg-opacity-10
       {% endif %}">
      <i class="fas fa-home text-base"></i> Dashboard
    </a>

    <a href="{% url 'resume_list' %}"
       class="flex items-center gap-3 px-3 py-2 rounded-md transition duration-200
       {% if request.resolver_match.url_name == 'resume_list' %}
         bg-white bg-opacity-20 font-semibold
       {% else %}
         hover:bg-white hover:bg-opacity-10
       {% endif %}">
      <i class="fas fa-file-alt text-base"></i> Resumes
    </a>

    {% if request.user.is_staff and not request.user.is_superuser %}
      <a href="{% url 'staff_moderation_view' %}"
         class="flex items-center gap-3 px-3 py-2 rounded-md transition duration-200
         {% if request.resolver_match.url_name == 'staff_moderation_view' %}
           bg-red-500 bg-opacity-30 font-semibold
         {% else %}
           hover:bg-red-500 hover:bg-opacity-20 text-red-200
         {% endif %}">
        <i class="fas fa-check-circle text-base"></i> Moderation
      </a>
    {% endif %}

    <a href="{% url 'profile' %}"
       class="flex items-center gap-3 px-3 py-2 rounded-md transition duration-200
       {% if request.resolver_match.url_name == 'profile' %}
         bg-white bg-opacity-20 font-semibold
       {% else %}
         hover:bg-white hover:bg-opacity-10
       {% endif %}">
      <i class="fas fa-user text-base"></i> Profile
    </a>

    {% if request.user.role == 'admin' and not request.user.is_superuser %}
      <a href="{% url 'admin_dashboard' %}"
         class="flex items-center gap-3 px-3 py-2 rounded-md transition duration-200
         {% if request.resolver_match.url_name == 'admin_dashboard' %}
           bg-yellow-500 bg-opacity-30 font-semibold
         {% else %}
           hover:bg-yellow-500 hover:bg-opacity-20 text-yellow-200
         {% endif %}">
        <i class="fas fa-cogs text-base"></i> Admin Dashboard
      </a>
    {% endif %}

    <a href="{% url 'logout' %}"
       class="flex items-center gap-3 px-3 py-2 rounded-md text-white text-opacity-70 hover:bg-white hover:bg-opacity-10 transition duration-200">
      <i class="fas fa-sign-out-alt text-base"></i> Logout
    </a>
  </nav>
</aside>
