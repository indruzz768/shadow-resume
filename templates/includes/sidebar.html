{% load static %}
<aside id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-white shadow-xl z-40 transform transition-transform duration-300 -translate-x-full md:relative md:translate-x-0 md:flex md:flex-col">
  <div class="flex items-center justify-center h-16 border-b">
    <img src="{% static 'images/shadow.png' %}" alt="Logo" class="h-10 w-10 rounded-full mr-2">
    <span class="font-semibold text-lg text-indigo-700">Shadow Resume</span>
  </div>
  <nav class="flex-1 px-4 py-6 space-y-3 text-gray-700">
    <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-indigo-50 hover:text-indigo-700 {% if request.path == '/accounts/dashboard/' %}bg-indigo-100 text-indigo-700 font-semibold{% endif %}">
      <i class="fas fa-home"></i> Dashboard
    </a>
    <a href="{% url 'resume_list' %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-indigo-50 hover:text-indigo-700">
      <i class="fas fa-file-alt"></i> Resumes
    </a>
    {% if request.user.is_staff and not request.user.is_admin %}
    <a href="{% url 'staff_moderation' %}" class="flex items-center gap-3 px-3 py-2 rounded-md text-red-600 hover:bg-red-50">
      <i class="fas fa-check-circle"></i> Moderation
    </a>
    {% endif %}
    <a href="{% url 'profile' %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-indigo-50 hover:text-indigo-700">
      <i class="fas fa-user"></i> Profile
    </a>
    {% if request.user.is_superuser %}
    <a href="{% url 'admin_dashboard' %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-indigo-50 hover:text-indigo-700">
      <i class="fas fa-cogs"></i> Admin Dashboard
    </a>
    {% endif %}
    <a href="{% url 'logout' %}" class="flex items-center gap-3 px-3 py-2 rounded-md text-gray-500 hover:bg-gray-100">
      <i class="fas fa-sign-out-alt"></i> Logout
    </a>
  </nav>
</aside>
