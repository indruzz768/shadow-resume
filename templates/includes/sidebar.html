{% load static %}
<aside
  id="sidebar"
  class="fixed top-0 left-0 w-64 h-full bg-white shadow-xl z-40 transform transition-transform duration-300 -translate-x-full md:relative md:translate-x-0 md:flex md:flex-col"
>
  <!-- Spacer for header -->
  <div class="h-6 md:h-4"></div>

  <nav class="flex-1 px-4 py-6 space-y-3 text-gray-700">

    <a href="{% url 'dashboard' %}"
       class="flex items-center gap-3 px-3 py-2 rounded-md cursor-pointer hover:bg-indigo-50 hover:text-indigo-700 
       {% if request.resolver_match.url_name == 'dashboard' %}bg-indigo-100 text-indigo-700 font-semibold{% endif %}">
      <i class="fas fa-home"></i> Dashboard
    </a>

    <a href="{% url 'resume_list' %}"
       class="flex items-center gap-3 px-3 py-2 rounded-md cursor-pointer hover:bg-indigo-50 hover:text-indigo-700
       {% if request.resolver_match.url_name == 'resume_list' %}bg-indigo-100 text-indigo-700 font-semibold{% endif %}">
      <i class="fas fa-file-alt"></i> Resumes
    </a>

    {% if request.user.is_staff and not request.user.is_superuser %}
    <a href="{% url 'staff_moderation' %}"
       class="flex items-center gap-3 px-3 py-2 rounded-md cursor-pointer text-red-600 hover:bg-red-50">
      <i class="fas fa-check-circle"></i> Moderation
    </a>
    {% endif %}

    <a href="{% url 'profile' %}"
       class="flex items-center gap-3 px-3 py-2 rounded-md cursor-pointer hover:bg-indigo-50 hover:text-indigo-700
       {% if request.resolver_match.url_name == 'profile' %}bg-indigo-100 text-indigo-700 font-semibold{% endif %}">
      <i class="fas fa-user"></i> Profile
    </a>

{% if request.user.is_superuser or request.user.groups.filter(name='Admin').exists %}
  <a href="{% url 'admin_dashboard' %}"
     class="flex items-center gap-3 px-3 py-2 rounded-md cursor-pointer hover:bg-indigo-50 hover:text-indigo-700
     {% if request.resolver_match.url_name == 'admin_dashboard' %}bg-indigo-100 text-indigo-700 font-semibold{% endif %}">
    <i class="fas fa-cogs"></i> Admin Dashboard
  </a>
{% endif %}

<a href="{% url 'logout' %}"
   class="flex items-center gap-3 px-3 py-2 rounded-md cursor-pointer text-gray-500 hover:bg-gray-100">
  <i class="fas fa-sign-out-alt"></i> Logout
</a>
</nav>
</aside>
