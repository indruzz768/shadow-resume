{% extends 'base.html' %}
{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-20 bg-white shadow-md rounded-xl p-8 text-center">
  <h2 class="text-2xl font-bold text-red-600 mb-4">🗑️ Confirm Delete</h2>
  <p class="text-gray-700 mb-6">
    Are you sure you want to permanently delete the resume:
    <span class="font-semibold text-gray-900">“{{ resume.full_name }}”</span>?
  </p>

  <form method="post" class="flex justify-center gap-4">
    {% csrf_token %}
    <button type="submit"
            class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-md font-medium transition">
      ✅ Yes, Delete
    </button>
    <a href="{% url 'resume_list' %}"
       class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-5 py-2 rounded-md font-medium transition">
      ❌ Cancel
    </a>
  </form>
</div>
{% endblock %}
